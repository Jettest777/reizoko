<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 2px 12px;letter-spacing:.02em}
h2{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;color:var(--sub);font-size:15px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on[data-v=fridge]{color:var(--green)}.seg button.on[data-v=freezer]{color:var(--ice)}
.alert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:12px 14px;margin:12px 0 0;font-weight:600;font-size:15px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert button{margin-left:auto;font-size:13px;font-weight:700;text-decoration:underline;color:inherit;white-space:nowrap}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px}
.item .emo{font-size:26px;width:34px;text-align:center;flex:none}
.item .body{flex:1;min-width:0;text-align:left}
.item .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.tag.fridge{background:var(--green-bg);color:var(--green)}.tag.freezer{background:var(--ice-bg);color:var(--ice)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}

.usebtn{flex:none;background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;min-height:44px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.empty .big{font-size:44px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:#fff;text-align:center;text-decoration:none;min-height:48px}

.btn.sub{background:var(--soft);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad-bg)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

nav button.on{color:var(--accent)}nav button.on .i{filter:none;opacity:1}

#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}

#sheet h3{margin:4px 0 4px;font-size:19px}
.open #shade,.open #sheet{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;z-index:20;display:none;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast button{color:inherit;text-decoration:underline;font-weight:700;white-space:nowrap}
.dish{margin-bottom:12px}
.dish .role{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.dish h3{margin:2px 0 4px;font-size:19px}
.dish p{margin:0 0 8px;color:var(--sub);font-size:14px}
.dish ol{padding-left:22px;margin:8px 0}.dish li{margin-bottom:6px;font-size:15px}
.dish details summary{font-weight:700;padding:8px 0;cursor:pointer}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.uses span{font-size:13px;border-radius:8px;padding:3px 8px;background:var(--soft)}
.uses span.hot{background:var(--warn-bg);color:var(--warn);font-weight:700}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.rv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rv.off{opacity:.5}
.rv .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rv input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--green)}
.rv .g{display:grid;grid-template-columns:1fr 1fr 1.1fr 1.6fr;gap:6px}
.rv .g input,.rv .g select{padding:8px 6px;min-height:40px;font-size:14px}
.steps-guide{padding-left:20px;font-size:14px;color:var(--sub)}
a{color:var(--accent)}

<script>

['きゅうり','野菜','本',5,14,'胡瓜'],['なす','野菜','本',5,30,'茄子','ナス'],['ピーマン','野菜','個',10,30],['パプリカ','野菜','個',10,30],['ブロッコリー','野菜','個',5,30],['カリフラワー','野菜','個',5,30],

['りんご','果物','個',30,30,'林檎'],['バナナ','果物','本',5,30],['みかん','果物','個',14,30,'蜜柑'],['いちご','果物','パック',3,30,'苺'],['ぶどう','果物','パック',5,30,'葡萄'],['キウイ','果物','個',14,30],['レモン','果物','個',14,30],
['鶏もも肉','肉','パック',2,30,'とりもも','鶏モモ','鶏肉'],['鶏むね肉','肉','パック',2,30,'とりむね','鶏ムネ'],['ささみ','肉','パック',2,30],['手羽','肉','パック',2,30],['豚こま肉','肉','パック',3,30,'豚小間','豚こま','豚肉'],

const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kata2hira(String(s||'').toLowerCase().replace(/[\s　]/g,''));
const FOOD_IX=FOODS.map(f=>({name:f[0],cat:f[1],unit:f[2],fridge:f[3],freezer:f[4],keys:[f[0],...f.slice(5)].map(norm)}));
function lookup(name){const n=norm(name);if(!n)return null;let best=null,len=0;
  for(const f of FOOD_IX)for(const k of f.keys)if(n.includes(k)&&k.length>len){best=f;len=k.length}
  return best}
function suggest(name){const n=norm(name);if(!n)return[];
  return FOOD_IX.filter(f=>f.keys.some(k=>k.includes(n))&&norm(f.name)!==n).slice(0,6)}
function shelfDays(name,loc,cat){const f=lookup(name);
  if(f)return loc==='freezer'?f.freezer:f.fridge;
  if(loc==='freezer')return cat==='冷凍食品'?90:30;
  return {'肉':2,'魚':2,'野菜':7,'果物':7,'乳製品・卵':7,'大豆製品':5,'主食':4,'加工品':7,'調味料':90,'飲料':14}[cat]||7}

/* ========== 日付 ========== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysLeft=exp=>Math.round((parse(exp)-parse(today()))/864e5);
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};

/* ========== 状態 ========== */

const DEF={items:[],menu:null,settings:{apiKey:'',model:'gemini-3.5-flash-lite',remindDays:2,remindHour:17,people:2,autoMenu:true}};
let S=load(),view='home',filter='all',undoSnap=null,busy=false,form=null,review=null,menuErr='';
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)return{...DEF,...r,settings:{...DEF.settings,...(r.settings||{})}}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存に失敗しました')}}
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=n=>String(Math.round(n*100)/100);
const stepOf=u=>u==='g'||u==='ml'?50:(u==='kg'||u==='L'?0.1:0.5);
function status(it){const d=daysLeft(it.exp);
  if(d<0)return{k:'bad',t:Math.abs(d)+'日超過',d};if(d===0)return{k:'bad',t:'今日まで',d};
  if(d<=S.settings.remindDays)return{k:'warn',t:'あと'+d+'日',d};return{k:'ok',t:'あと'+d+'日',d}}
const sorted=()=>[...S.items].sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:0);
function snap(){undoSnap=JSON.stringify(S.items)}
function undo(){if(undoSnap){S.items=JSON.parse(undoSnap);undoSnap=null;save();render();toast('元に戻しました')}}

/* ========== トースト / シート ========== */
let toastT;
function toast(msg,withUndo){const t=document.getElementById('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(withUndo?'<button data-act="undo">元に戻す</button>':'');
  t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',withUndo?6000:2600)}
function openSheet(html){document.getElementById('sheet').innerHTML='<div class="grip"></div>'+html;document.body.classList.add('open');document.getElementById('sheet').scrollTop=0}
function closeSheet(){document.body.classList.remove('open')}

/* ========== 画面 ========== */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===view));
  const el=document.getElementById('app');
  el.innerHTML=({home:vHome,menu:vMenu,add:vAdd,settings:vSettings}[view])();
}
function itemRow(it){const st=status(it);
  return `<div class="item"><button class="emo" data-act="edit" data-id="${it.id}" aria-label="編集">${CATS[it.cat]||'📦'}</button>
  <button class="body" data-act="edit" data-id="${it.id}"><div class="nm">${esc(it.name)}</div>
  <div class="meta"><span>${fq(it.qty)}${esc(it.unit)}</span><span class="tag ${it.loc}">${it.loc==='freezer'?'冷凍':'冷蔵'}</span>
  <span class="badge ${st.k}">${st.t}</span><span>${md(it.exp)}${it.est?'頃':''}</span></div></button>
  <button class="usebtn" data-act="use" data-id="${it.id}">使った</button></div>`}
function vHome(){
  const all=sorted(),list=all.filter(i=>filter==='all'||i.loc===filter);
  const bad=all.filter(i=>status(i).k==='bad').length,warn=all.filter(i=>status(i).k==='warn').length;
  let alert='';
  if(bad||warn)alert=`<div class="alert ${bad?'bad':'warn'}"><span>${bad?'⚠️':'⏰'}</span><span>${bad?`期限切れ・今日まで ${bad}品`:''}${bad&&warn?'／':''}${warn?`もうすぐ ${warn}品`:''}</span><button data-nav="menu">献立に使う</button></div>`;
  else if(all.length)alert=`<div class="alert ok"><span>✅</span><span>急いで使う食材はありません</span></div>`;
  const grp=k=>list.filter(i=>status(i).k===k);
  const sec=(t,a)=>a.length?`<h2>${t}（${a.length}）</h2>`+a.map(itemRow).join(''):'';
  const cF=all.filter(i=>i.loc==='fridge').length,cZ=all.length-cF;
  return `<h1>れいぞうこ番</h1>
  <div class="seg">${[['all','すべて '+all.length],['fridge','冷蔵庫 '+cF],['freezer','冷凍庫 '+cZ]].map(([v,t])=>`<button data-act="filter" data-v="${v}" class="${filter===v?'on':''}">${t}</button>`).join('')}</div>
  ${alert}
  ${list.length?sec('期限切れ・今日まで',grp('bad'))+sec('もうすぐ期限',grp('warn'))+sec('まだ大丈夫',grp('ok'))
   :`<div class="empty"><div class="big">🧊</div><p>${all.length?'ここには何も入っていません':'まだ食材がありません。<br>下の「＋」からレシートを撮るか、手入力で追加しましょう。'}</p></div>`}
  ${all.length?`<h2>リマインダー</h2><button class="btn line" data-act="ics">📅 期限をカレンダーに登録する</button><p class="hint">期限の${S.settings.remindDays}日前 ${S.settings.remindHour}:00 に通知される予定をまとめて作ります。</p>`:''}`}

function autoFill(force){ // 名前や保存場所から目安を入れる
  const f=lookup(form.name);
  if(f&&!form.id&&!form.catTouched){form.cat=f.cat;if(!form.unitTouched)form.unit=f.unit}
  if(!form.touched||force){form.exp=addDays(form.bought||today(),shelfDays(form.name,form.loc,form.cat));form.est=true;form.touched=false}
  const g=id=>document.getElementById(id);if(!g('fExp'))return;
  g('fExp').value=form.exp;g('fCat').value=form.cat;g('fUnit').value=form.unit;

    :`目安: ${f?esc(f.name)+'は':''}${form.loc==='freezer'?'冷凍':'冷蔵'}で約${days}日。パッケージに期限があれば書き換えてください。`;

/* ========== Gemini ========== */
async function gemini(parts,temp){const s=S.settings;
  if(!s.apiKey)throw new Error('設定で Gemini APIキーを登録してください');
  let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(s.model)+':generateContent',{method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':s.apiKey},
    body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{responseMimeType:'application/json',temperature:temp==null?0.4:temp}})})}
  catch(e){throw new Error('通信できませんでした。電波の状態を確認してください')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message||''}catch(e){}
    if(r.status===429)throw new Error('無料枠の上限に達しました。少し待つか、明日もう一度お試しください');
    if(r.status===404)throw new Error('モデル「'+s.model+'」が見つかりません。設定でモデル名を変更してください');
    if(r.status===400||r.status===401||r.status===403)throw new Error('APIキーが正しくないか、利用できません（'+m.slice(0,80)+'）');
    throw new Error('AIの応答エラー（'+r.status+'）')}
  const j=await r.json();const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  try{return JSON.parse(txt.replace(/^```(?:json)?\s*|\s*```$/g,''))}catch(e){throw new Error('AIの返答を読み取れませんでした。もう一度お試しください')}}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    res(c.toDataURL('image/jpeg',0.85).split(',')[1])};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('画像を開けませんでした'))};img.src=u})}
async function readReceipt(file){
  busy=true;render();
  try{const data=await shrink(file);
    const out=await gemini([{text:`これは日本のスーパー等のレシート画像です。食品・飲料だけを抽出し、次の形のJSONだけを返してください。
{"items":[{"name":"一般的な食材名(例: 鶏もも肉、キャベツ。ブランド名・産地・略号・容量表記は除く)","qty":数値,"unit":"${UNITS.join('|')} のどれか","category":"${Object.keys(CATS).join('|')} のどれか","loc":"fridge|freezer|pantry","days":購入日からの一般的な日持ち日数(整数)}]}
ルール: 日用品・レジ袋・値引き行・小計・合計・ポイントは除外。同じ商品は数量をまとめる。重さが分かる肉や魚は unit を g にしてもよい。loc は家庭での普通の保存場所。pantry は常温保存品(米、缶詰、乾物、菓子、未開封の調味料など)。読み取れない行は推測せず除外。`},
      {inline_data:{mime_type:'image/jpeg',data}}],0.1);
    const list=(out.items||out||[]);if(!Array.isArray(list)||!list.length)throw new Error('食品が見つかりませんでした。明るい場所で撮り直してみてください');
    review=list.map(r=>{const name=String(r.name||'').trim(),f=lookup(name),loc=r.loc==='freezer'?'freezer':'fridge';
      const cat=CATS[r.category]?r.category:(f?f.cat:'その他');
      const days=f?(loc==='freezer'?f.freezer:f.fridge):(parseInt(r.days)>0?parseInt(r.days):shelfDays(name,loc,cat));
      return{on:r.loc!=='pantry'&&!!name,name,qty:parseFloat(r.qty)>0?parseFloat(r.qty):1,unit:UNITS.includes(r.unit)?r.unit:(f?f.unit:'個'),cat,loc,exp:addDays(today(),days)}}).filter(r=>r.name);
  }catch(e){toast(e.message)}
  busy=false;render()}
async function genMenu(silent){
  const items=sorted().filter(i=>daysLeft(i.exp)>=-1);if(!items.length||busy)return;
  busy=true;menuErr='';if(!silent||view==='menu')render();
  const prev=S.menu&&S.menu.dishes?S.menu.dishes.map(d=>d.name):[];
  try{const inv=items.map(i=>({id:i.id,name:i.name,qty:i.qty,unit:i.unit,place:i.loc==='freezer'?'冷凍':'冷蔵',days_left:daysLeft(i.exp)}));
    const out=await gemini([{text:`あなたは家庭料理の献立アドバイザーです。下の在庫から今日の献立(主菜・副菜・汁物の2〜3品)を${S.settings.people}人分で考えてください。
- days_left が小さい食材(特に ${S.settings.remindDays} 以下)を最優先で使い切る。冷凍品は急がない。
- 塩・砂糖・醤油・味噌・酒・みりん・酢・油・だし・こしょう・片栗粉・小麦粉・米は常備していると仮定してよい。それ以外で在庫にないものはできるだけ使わない。
- 家庭で無理なく作れる手順(各6ステップ以内)。肉・魚は中心まで十分に加熱する。
${S.wish?'- 希望: '+S.wish+'\n':''}${prev.length?'- 前回の提案('+prev.join('、')+')とは別の料理にする。\n':''}
次の形のJSONだけを返す:
{"comment":"献立のひとこと(20字以内)","dishes":[{"role":"主菜|副菜|汁物","name":"料理名","desc":"一文の説明","minutes":調理分数,"uses":[{"id":"在庫のid","name":"食材名","qty":使う量(在庫と同じ単位の数値),"unit":"単位"}],"others":["在庫以外に使う材料と分量"],"steps":["手順"],"search":"クックパッド検索用に主な食材を2つ、空白区切り"}]}
在庫: ${JSON.stringify(inv)}`}],0.8);
    if(!out.dishes||!out.dishes.length)throw new Error('献立を作れませんでした。もう一度お試しください');
    S.menu={date:today(),comment:out.comment||'',dishes:out.dishes};save();
    if(silent&&view!=='menu')toast('今日の献立ができました');
  }catch(e){if(!silent)menuErr=e.message;S.menuTried=today();save()}
  busy=false;render()}

/* ========== カレンダー(.ics) / ファイル ========== */
function buildIcs(){const s=S.settings,byDay={};const now=new Date();
  for(const it of S.items){const d=daysLeft(it.exp);if(d<0)continue;let day=addDays(it.exp,-s.remindDays);if(day<today())day=today();(byDay[day]=byDay[day]||[]).push(it)}
  const fold=t=>t.replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const stamp=now.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//reizokoban//JA','CALSCALE:GREGORIAN'],n=0;
  for(const day of Object.keys(byDay).sort()){let h=s.remindHour;if(day===today()&&now.getHours()>=h)h=Math.min(23,now.getHours()+1);
    const its=byDay[day],dt=day.replace(/-/g,'')+'T'+pad(h)+'0000',dte=day.replace(/-/g,'')+'T'+pad(h)+'1500';
    out.push('BEGIN:VEVENT','UID:'+day+'@reizokoban','DTSTAMP:'+stamp,'DTSTART:'+dt,'DTEND:'+dte,
      'SUMMARY:'+fold('🧊 使い切ろう: '+its.map(i=>i.name).join('、')),
      'DESCRIPTION:'+fold(its.map(i=>i.name+' '+fq(i.qty)+i.unit+'（'+(i.loc==='freezer'?'冷凍':'冷蔵')+'・期限 '+md(i.exp)+'）').join('\n')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+fold('期限が近い食材があります'),'TRIGGER:PT0M','END:VALARM','END:VEVENT');n++}
  out.push('END:VCALENDAR');return{text:out.join('\r\n'),count:n}}
async function giveFile(name,text,type){const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ========== イベント ========== */
document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){e.preventDefault();if(view==='settings')readSettings();view=nav.dataset.nav;if(view!=='add')review=review;closeSheet();render();window.scrollTo(0,0);return}
  if(e.target.id==='shade'){closeSheet();if(form&&form.id)form=null;return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,it=id&&S.items.find(i=>i.id===id);
  if(b.tagName==='A')e.preventDefault();
  switch(a){
  case'undo':undo();document.getElementById('toast').style.display='none';break;
  case'filter':filter=b.dataset.v;render();break;
  case'use':if(it)useSheet(it);break;
  case'uQty':{const q=document.getElementById('uQty'),st=+q.dataset.step,mx=+q.dataset.max;q.value=fq(Math.max(st,Math.min(mx,(parseFloat(q.value)||0)+st*b.dataset.d)));break}
  case'uSome':{const v=parseFloat(document.getElementById('uQty').value);if(!(v>0))break;snap();const gone=v>=it.qty;consume(id,v);save();closeSheet();render();toast(gone?it.name+' を使い切りました':it.name+' を '+fq(v)+it.unit+' 使いました',true);break}
  case'uAll':snap();consume(id);save();closeSheet();render();toast(it.name+' を使い切りました',true);break;
  case'edit':if(it)editSheet(it);break;
  case'del':snap();consume(id);save();closeSheet();form=null;render();toast(it.name+' を削除しました',true);break;
  case'move':{snap();const to=it.loc==='fridge'?'freezer':'fridge';it.loc=to;it.exp=to==='freezer'?addDays(today(),shelfDays(it.name,'freezer',it.cat)):addDays(today(),2);it.est=true;save();closeSheet();form=null;render();toast(it.name+' を'+(to==='freezer'?'冷凍庫':'冷蔵庫')+'へ移しました',true);break}
  case'fLoc':syncForm();form.loc=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));autoFill(!form.id&&!form.touched);break;
  case'fQty':{syncForm();const st=stepOf(form.unit)===0.5?1:stepOf(form.unit);form.qty=Math.max(st,Math.round((form.qty+st*b.dataset.d)*100)/100);document.getElementById('fQty').value=fq(form.qty);break}
  case'fPick':syncForm();form.name=b.dataset.n;document.getElementById('fName').value=form.name;autoFill();break;
  case'fReset':syncForm();autoFill(true);break;
  case'fSave':{syncForm();if(!form.name){toast('食材名を入れてください');break}if(!(form.qty>0)){toast('数量を入れてください');break}
    const rec={id:form.id||uid(),name:form.name,cat:form.cat,loc:form.loc,qty:form.qty,unit:form.unit,bought:form.bought,exp:form.exp,est:!form.touched};
    if(form.id){const i=S.items.findIndex(x=>x.id===form.id);if(i>=0)S.items[i]=rec;closeSheet()}else S.items.push(rec);
    save();const wasNew=!form.id;form=null;if(wasNew)view='add';render();toast(rec.name+(wasNew?' を在庫に入れました':' を保存しました'));break}
  case'receipt':if(!S.settings.apiKey){toast('先に設定で Gemini APIキーを登録してください');break}document.getElementById('receiptFile').click();break;
  case'rvSave':{const add=review.filter(r=>r.on&&r.name&&r.qty>0);for(const r of add)S.items.push({id:uid(),name:r.name,cat:r.cat,loc:r.loc,qty:r.qty,unit:r.unit,bought:today(),exp:r.exp,est:true});
    save();review=null;view='home';render();toast(add.length+' 品を在庫に入れました');break}
  case'rvCancel':review=null;render();break;
  case'people':S.settings.people=+b.dataset.v;save();keepWish();render();break;
  case'genMenu':keepWish();genMenu(false);break;
  case'cooked':cookedSheet(+b.dataset.i);break;
  case'ckSave':{snap();let n=0;document.querySelectorAll('#sheet .rv').forEach(r=>{if(!r.querySelector('[data-ck=on]').checked)return;
      const all=r.querySelector('[data-ck=all]').checked,q=parseFloat(r.querySelector('[data-ck=qty]').value);consume(r.dataset.id,all?null:(q>0?q:0));n++});
    save();closeSheet();render();toast(n+' 品を在庫から引きました',true);break}
  case'ics':{const r=buildIcs();if(!r.count){toast('登録できる食材がありません');break}await giveFile('shokuzai-reminder.ics',r.text,'text/calendar');break}
  case'testKey':readSettings();b.disabled=true;b.textContent='確認中…';try{await gemini([{text:'{"ok":true} というJSONだけを返してください'}],0);toast('接続できました')}catch(er){toast(er.message)}render();break;
  case'export':{const copy={...S,settings:{...S.settings,apiKey:''}};await giveFile('reizokoban-backup-'+today()+'.json',JSON.stringify(copy,null,1),'application/json');break}
  case'import':document.getElementById('importFile').click();break;
  case'wipeAsk':openSheet('<h3>在庫をすべて消しますか？</h3><p class="hint">登録した食材がすべて消えます。設定とAPIキーは残ります。</p><div style="height:14px"></div><button class="btn danger" data-act="wipe">すべて消す</button><div style="height:8px"></div><button class="btn sub" data-act="close">やめる</button>');break;
  case'wipe':snap();S.items=[];S.menu=null;save();closeSheet();render();toast('在庫を消しました',true);break;
  case'close':closeSheet();break;
  }});
function keepWish(){const w=document.getElementById('wish');if(w)S.wish=w.value.trim()}
function readSettings(){const g=id=>document.getElementById(id);if(!g('sKey'))return;const s=S.settings;
  s.apiKey=g('sKey').value.trim();s.model=g('sModel').value.trim()||DEF.settings.model;s.autoMenu=g('sAuto').checked;s.remindDays=+g('sDays').value;s.remindHour=+g('sHour').value;save()}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='fName'){form.name=t.value.trim();autoFill()}
  else if(t.id==='fExp'){form.exp=t.value;form.touched=true;form.est=false;syncForm();autoFill()}
  else if(t.id==='fCat'){form.catTouched=true;syncForm();autoFill()}
  else if(t.id==='fUnit'){form.unitTouched=true;syncForm()}
  else if(t.dataset.rv){const box=t.closest('.rv'),r=review[+box.dataset.i],k=t.dataset.rv;
    if(k==='on'){r.on=t.checked;render()}else if(k==='qty')r.qty=parseFloat(t.value)||0;
    else if(k==='loc'){r.loc=t.value;r.exp=addDays(today(),shelfDays(r.name,r.loc,r.cat));box.querySelector('[data-rv=exp]').value=r.exp}
    else r[k]=t.value}
  else if(t.dataset.ck==='all'){const q=t.closest('.rv').querySelector('[data-ck=qty]');q.disabled=t.checked}
  else if(t.closest('#app')&&view==='settings')readSettings();
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='receiptFile'&&t.files[0]){const f=t.files[0];t.value='';view='add';readReceipt(f)}
  if(t.id==='importFile'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!Array.isArray(j.items))throw 0;
      const key=S.settings.apiKey;S={...DEF,...j,settings:{...DEF.settings,...(j.settings||{}),apiKey:key}};save();view='home';render();toast(S.items.length+' 品を復元しました')}catch(er){toast('バックアップファイルを読み込めませんでした')}};rd.readAsText(t.files[0]);t.value=''}
  if(t.id==='wish')keepWish();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();autoMenu()}});
function autoMenu(){const s=S.settings;if(s.apiKey&&s.autoMenu&&S.items.length&&(!S.menu||S.menu.date!==today())&&S.menuTried!==today())genMenu(true)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();autoMenu();
</script>
