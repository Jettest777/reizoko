<style>
:root{
  --g9:#12301f;--g8:#1d4a30;--g7:#2f7d4f;--g6:#3f9163;--g5:#5fa07a;--g4:#86b89a;--g3:#aed0bc;--g2:#d5e7dc;--g1:#e9f3ed;--g0:#f4f9f6;
  --ink:var(--g9);--sub:#5c7566;--line:var(--g2);--card:#fff;
  --acc:#cf4f2b;--acc-bg:#fbe4db;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.55 var(--sans)}
html{background:var(--g0)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh;
  background:radial-gradient(75% 40% at -10% 0%,rgba(47,125,79,.2),transparent 70%),radial-gradient(60% 34% at 112% 28%,rgba(95,160,122,.2),transparent 70%),radial-gradient(85% 40% at 20% 102%,rgba(47,125,79,.14),transparent 70%),var(--g0);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
h1{font:600 22px/1.4 var(--mincho);margin:8px 2px 14px;letter-spacing:.08em}
h2{font-size:12px;color:var(--sub);font-weight:600;margin:22px 4px 8px;letter-spacing:.14em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
a{color:var(--g7)}
svg.svgi{width:1.3em;height:1.3em;vertical-align:-.28em;flex:none}

/* ---------- 食材（冷蔵庫） ---------- */
.memo{position:relative;background:#fff;border:1px solid var(--line);margin:14px 6px 0;padding:20px 16px 12px;box-shadow:0 6px 16px rgba(18,48,31,.08);border-radius:3px;font-size:14.5px}
.memo::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-38px;width:76px;height:19px;background:rgba(47,125,79,.32);transform:rotate(-1.5deg)}
.memo b.t{display:block;font:600 16px/1.4 var(--mincho);letter-spacing:.08em;margin-bottom:6px}
.memo ul{list-style:none;margin:0;padding:0}
.memo li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--g3)}
.memo li span.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.memo .go{display:block;margin-top:10px;font-weight:600;font-size:13.5px;color:var(--g7);text-align:right;width:100%;letter-spacing:.04em}
.fridge{margin-top:18px;padding-top:14px !important;background:linear-gradient(168deg,var(--g6),var(--g7) 40%,#276b43);border-radius:22px 22px 14px 14px;padding:8px 8px 12px;box-shadow:0 18px 34px rgba(18,48,31,.28),inset 0 1px 0 rgba(255,255,255,.25);position:relative}
.fridge::after{content:"";position:absolute;left:24px;right:24px;bottom:-7px;height:7px;background:linear-gradient(90deg,var(--g8) 0 40px,transparent 40px calc(100% - 40px),var(--g8) calc(100% - 40px));border-radius:0 0 4px 4px}
.plate{display:flex;justify-content:center;margin:4px 0 2px}
.plate span{font:500 11px/1 var(--mincho);letter-spacing:.5em;text-indent:.5em;color:#fff;opacity:.85;padding:5px 0}
.comp{margin-top:8px;border-radius:14px;overflow:hidden;background:#fff}
.comp>button.door,.rack>button.door{display:flex;width:100%;align-items:center;gap:8px;padding:12px 14px;font-weight:600;font-size:15px;letter-spacing:.08em;text-align:left;min-height:48px;color:#fff}
.comp>button.door{background:linear-gradient(var(--g8),#17402a)}
.door .cnt{font-size:12px;font-weight:500;color:var(--g3);letter-spacing:.04em}
.door .handle{margin-left:auto;width:70px;height:7px;border-radius:4px;background:linear-gradient(#fff,var(--g2));box-shadow:0 2px 3px rgba(0,0,0,.3)}
.door .arrow{font-size:10px;color:var(--g3);width:14px;text-align:center}
.inside{position:relative;padding:4px 8px 0;box-shadow:inset 0 8px 14px -6px rgba(18,48,31,.3)}
.comp.fridge .inside{background:#fff}
.comp.freezer,.comp.freezer .inside{background-color:var(--g2)}
.comp.freezer .inside{background-image:radial-gradient(rgba(255,255,255,.95) 1.2px,transparent 1.5px),radial-gradient(rgba(255,255,255,.75) 1px,transparent 1.3px);background-size:28px 28px,19px 19px;background-position:0 0,9px 12px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:114px;background-image:linear-gradient(to bottom,transparent 104px,var(--g3) 104px,var(--g3) 107px,rgba(18,48,31,.05) 107px,transparent 114px);background-size:100% 114px}
.comp.freezer .shelf{background-image:linear-gradient(to bottom,transparent 104px,#fff 104px,#fff 107px,rgba(18,48,31,.08) 107px,transparent 114px)}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:104px;padding:0 3px 6px;min-width:0}
.tile .e{font-size:36px;line-height:1.1;filter:drop-shadow(0 4px 3px rgba(18,48,31,.18))}
.tile .n{font-size:12px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .q{font-size:10.5px;color:var(--sub);line-height:1.2}
.tile .bd{position:absolute;top:7px;right:3px;font-size:10px;font-weight:600;border-radius:3px;padding:1px 5px;color:var(--sub);white-space:nowrap;letter-spacing:.02em}
.tile .bd.warn{background:var(--acc-bg);color:var(--acc)}
.tile .bd.bad{background:var(--acc);color:#fff}
.tile:active{transform:scale(.95)}
.none{text-align:center;color:var(--sub);font-size:13px;padding:24px 0 28px;letter-spacing:.1em}
/* 常温の棚 */
.rack{margin-top:22px;border-radius:10px;overflow:hidden;background:var(--g0);border:6px solid var(--g5);box-shadow:0 14px 26px rgba(18,48,31,.18)}
.rack>button.door{background:linear-gradient(var(--g5),#559670);padding:10px 12px}
.rack .door .cnt,.rack .door .arrow{color:var(--g1)}
.rack .arrow{margin-left:auto}
.rack .inside{box-shadow:inset 0 8px 12px -6px rgba(18,48,31,.28);padding:4px 8px 0;background:var(--g0)}
.rack .shelf{background-image:linear-gradient(to bottom,transparent 104px,var(--g4) 104px,var(--g5) 108px,rgba(18,48,31,.1) 108px,transparent 114px)}
.cal{display:flex;gap:12px;align-items:center;margin-top:22px;background:#fff;border-radius:12px;padding:13px 14px;border:1px solid var(--line);width:100%;text-align:left;font-weight:600;font-size:15px}
.cal small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.cal .ic{font-size:22px;color:var(--g7)}

/* ---------- 追加 ---------- */
.receipt{display:block;width:100%;background:#fff;padding:18px 16px 26px;text-align:center;font-weight:600;font-size:16px;letter-spacing:.06em;filter:drop-shadow(0 6px 10px rgba(18,48,31,.14));--z:10px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/var(--z) 51% repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - var(--z)/2) no-repeat;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/var(--z) 51% repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - var(--z)/2) no-repeat}
.receipt small{display:block;font-weight:400;color:var(--sub);font-size:12.5px;margin-top:8px;border-top:1px dashed var(--g3);padding-top:8px;letter-spacing:0}
.receipt .cam{font-size:26px;display:block;color:var(--g7);margin-bottom:4px}
.receipt:disabled{opacity:.6}
.doorcard{background:linear-gradient(168deg,var(--g6),var(--g7));border-radius:20px;padding:8px;box-shadow:0 14px 28px rgba(18,48,31,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.doorcard .in{background:#fff;border-radius:13px;padding:6px 14px 16px;box-shadow:inset 0 6px 12px -6px rgba(18,48,31,.3)}
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.locs button{border-radius:12px;padding:10px 4px 8px;font-weight:600;font-size:13.5px;background:#fff;border:1.5px solid var(--line);color:var(--sub);min-height:72px;letter-spacing:.1em}
.locs button .e{display:block;font-size:20px;line-height:1.5}
.locs button.on{background:var(--g7);border-color:var(--g7);color:#fff}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin:14px 2px 6px;letter-spacing:.06em}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
textarea{resize:none;display:block;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g5);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.step{flex:none;width:46px;height:46px;border-radius:10px;background:var(--g1);font-size:20px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:600;font-size:15.5px;letter-spacing:.08em;background:var(--g7);color:#fff;text-align:center;text-decoration:none;min-height:50px}
.btn:active{opacity:.85}
.btn.sub{background:var(--g1);color:var(--g8)}
.btn.line{background:#fff;border:1.5px solid var(--g3);color:var(--g8)}
.btn.danger{background:none;color:var(--acc);border:1.5px solid var(--acc-bg)}
.btn:disabled{opacity:.5}
.paper{background:#fff;padding:18px 14px 6px;box-shadow:0 8px 18px rgba(18,48,31,.12)}
.paper .hd{text-align:center;font:600 15px var(--mincho);letter-spacing:.5em;text-indent:.5em;border-bottom:1px dashed var(--g3);padding-bottom:12px;margin-bottom:4px}
.rv{padding:11px 0;border-bottom:1px dashed var(--g3)}
.rv.off{opacity:.4}
.rv .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input[type=checkbox],input[type=range]{accent-color:var(--g7)}
input[type=range]{width:100%;height:36px}
.rv input[type=checkbox]{width:26px;height:26px;flex:none}
.rv .g{display:grid;grid-template-columns:.9fr 1fr 1.05fr 1.6fr;gap:6px}
.rv .g input,.rv .g select{padding:8px 6px;min-height:40px;font-size:14px}

/* ---------- 献立・記録 ---------- */
.oshina{position:relative;background:#fff;border-radius:4px;padding:26px 18px 16px;box-shadow:0 14px 30px rgba(18,48,31,.14)}
.oshina::before{content:"";position:absolute;inset:7px;border:1px solid var(--g3);border-radius:2px;pointer-events:none}
.oshina>*{position:relative}
.oshina .ttl{font:600 23px/1.4 var(--mincho);text-align:center;letter-spacing:.5em;text-indent:.5em;margin:4px 0 0}
.oshina .ttl::after{content:"";display:block;width:36px;height:1px;background:var(--g7);margin:10px auto 8px}
.oshina .dt{text-align:center;font-size:12px;color:var(--sub);letter-spacing:.14em}
.oshina .cm{text-align:center;font:500 14.5px var(--mincho);color:var(--g7);margin:6px 0 10px;letter-spacing:.08em}
.dish{padding:14px 4px 16px}.dish+.dish{border-top:1px dotted var(--g3)}
.cat{display:flex;align-items:center;gap:10px;font:600 15px var(--mincho);letter-spacing:.3em;color:#fff;background:var(--g7);border-radius:3px;padding:6px 12px;margin:14px 0 2px}.cat span{font-size:20px;letter-spacing:0;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:-2px 0}
.dish .hd{display:flex;gap:14px;align-items:center}
.platei{flex:none;width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:inset 0 0 0 6px var(--g0),inset 0 0 0 7px var(--g2),0 5px 10px rgba(18,48,31,.16)}
.stamp{display:inline-block;font:600 11px var(--mincho);color:var(--g7);border:1px solid var(--g7);border-radius:2px;padding:1px 6px;letter-spacing:.3em;text-indent:.3em}
.dish h3,.rec h3{margin:5px 0 0;font:600 18.5px/1.4 var(--mincho);letter-spacing:.04em}
.dish .min{font-size:12px;color:var(--sub);margin-left:8px}
.dish p,.rec p{margin:10px 0 8px;color:var(--sub);font-size:14px}
.dish ol,.rec ol{padding-left:22px;margin:8px 0}.dish li,.rec li{margin-bottom:8px;font-size:15px}
details summary{font-weight:600;font-size:14.5px;padding:8px 0;cursor:pointer;color:var(--g7);letter-spacing:.06em}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.uses span{font-size:12.5px;border-radius:3px;padding:3px 8px;background:var(--g1)}
.uses span.hot{background:var(--acc-bg);color:var(--acc);font-weight:600}
.pot{text-align:center;padding:26px 0 18px;font-size:14.5px;color:var(--sub);letter-spacing:.06em}
.pot .p{font-size:46px;display:block;margin-bottom:8px}
.pot .s{display:block;font-size:18px;color:var(--g4);letter-spacing:.3em;animation:steam 1.8s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.seg{display:flex;background:var(--g1);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-weight:600;color:var(--sub);font-size:14.5px}
.seg button.on{background:var(--g7);color:#fff}
.alert{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14.5px;background:var(--acc-bg);color:var(--acc)}
.day{display:flex;align-items:center;gap:10px;font:600 14px var(--mincho);letter-spacing:.14em;color:var(--g8);margin:24px 2px 10px}
.day::after{content:"";flex:1;height:1px;background:var(--g3)}
.rec{background:#fff;border:1px solid var(--line);border-left:4px solid var(--g7);border-radius:4px 12px 12px 4px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:0 6px 14px rgba(18,48,31,.07)}
.rec .cnt140{text-align:right;font-size:11px;color:var(--sub);margin-top:3px}
.rec .acts{display:flex;gap:16px;justify-content:flex-end;margin-top:6px;font-size:13px;font-weight:600}
.rec .acts button{color:var(--sub);text-decoration:underline}

/* ---------- 共通部品 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--g4);padding:4px 0;min-height:50px}
nav button .i{line-height:0}
nav button .i svg{width:24px;height:24px}
nav button.on{color:var(--g7)}
nav button.plus{color:var(--g7)}
nav button.plus .i{background:var(--g7);color:#fff;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 12px rgba(18,48,31,.3);border:3px solid #fff}
nav button.plus .i svg{width:26px;height:26px}
#shade{position:fixed;inset:0;background:rgba(18,48,31,.5);z-index:10;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--g0);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:none;max-width:560px;margin:0 auto}
#sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--g3);margin:4px auto 10px}
#sheet h3{margin:4px 0 4px;font:600 19px/1.4 var(--mincho);letter-spacing:.06em}
#sheet .big{font-size:50px;text-align:center;line-height:1.15}
.open #shade,.open #sheet{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--g9);color:#fff;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:600;z-index:20;display:none;gap:14px;align-items:center;max-width:92vw;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#toast button{color:#fff;text-decoration:underline;font-weight:600;white-space:nowrap}
.badge{font-size:11.5px;font-weight:600;border-radius:3px;padding:2px 7px;white-space:nowrap}
.badge.bad{background:var(--acc);color:#fff}.badge.warn{background:var(--acc-bg);color:var(--acc)}.badge.ok{background:var(--g1);color:var(--sub)}
.steps-guide{padding-left:20px;font-size:14px;color:var(--sub)}
</style>
</head>
<body class="v-home">
<main id="app"></main>
<nav><div>
  <button data-nav="home"><span class="i" data-ic="food"></span>食材</button>
  <button data-nav="menu"><span class="i" data-ic="pot"></span>献立</button>
  <button data-nav="add" class="plus"><span class="i" data-ic="plus"></span>追加</button>
  <button data-nav="log"><span class="i" data-ic="book"></span>記録</button>
  <button data-nav="settings"><span class="i" data-ic="sliders"></span>設定</button>
</div></nav>
<div id="shade"></div><div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="receiptFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>

const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kata2hira(String(s||'').toLowerCase().replace(/[\s　]/g,''));

function lookup(name){const n=norm(name);if(!n)return null;let best=null,len=0;
  for(const f of FOOD_IX)for(const k of f.keys)if(n.includes(k)&&k.length>len){best=f;len=k.length}
  return best}
function suggest(name){const n=norm(name);if(!n)return[];
  return FOOD_IX.filter(f=>f.keys.some(k=>k.includes(n))&&norm(f.name)!==n).slice(0,6)}
const KEEP_DEF={fridge:3,freezer:21,pantry:0};
function shelfDays(name,loc,cat,keep){if(keep&&keep[loc]!=null)return Math.max(0,+keep[loc]||0);if(cat==='作りおき')return KEEP_DEF[loc];const f=lookup(name);
  if(f)return f[loc];
  if(loc==='freezer')return cat==='冷凍食品'?90:30;
  if(loc==='pantry')return PERISH.includes(cat)?1:({'野菜':5,'果物':5,'主食':30,'調味料':180,'缶詰・乾物':365,'お菓子':60,'飲料':180}[cat]||30);
  return {'肉':2,'魚':2,'野菜':7,'果物':7,'乳製品・卵':7,'大豆製品':5,'主食':4,'加工品':7,'調味料':90,'缶詰・乾物':90,'お菓子':30,'飲料':14}[cat]||7}
function roomOk(name,cat,keep){if(cat==='作りおき')return shelfDays(name,'pantry',cat,keep)>0;const f=lookup(name);return f?f.roomOk:!PERISH.includes(cat)}
const emo=it=>{if(it.cat==='作りおき')return'🍱';const f=lookup(it.name);return (f&&EMO[f.name])||CATS[it.cat]||'📦'};

/* ========== 日付 ========== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysLeft=exp=>Math.round((parse(exp)-parse(today()))/864e5);
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};

const KEY='reizokoban.v1';

function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)return{...DEF,...r,log:r.log||[],fold:r.fold||{},settings:{...DEF.settings,...(r.settings||{})}}}catch(e){}return JSON.parse(JSON.stringify(DEF))}

const fq=n=>String(Math.round(n*100)/100);
const stepOf=u=>u==='%'?10:u==='g'||u==='ml'?50:(u==='kg'||u==='L'?0.1:0.5);
function status(it){const d=daysLeft(it.exp);
  if(d<0)return{k:'bad',t:'期限切れ',d};if(d===0)return{k:'bad',t:'今日まで',d};
  const t=d>60?'あと'+Math.round(d/30)+'か月':'あと'+d+'日';
  return{k:d<=S.settings.remindDays?'warn':'ok',t,d}}
const sorted=()=>[...S.items].sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:0);
function snap(){undoSnap=JSON.stringify({i:S.items,l:S.log})}
function undo(){if(undoSnap){const u=JSON.parse(undoSnap);S.items=u.i;S.log=u.l;undoSnap=null;save();render();toast('元に戻しました')}}

/* ========== トースト / シート ========== */
let toastT;
function toast(msg,withUndo){const t=document.getElementById('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(withUndo?'<button data-act="undo">元に戻す</button>':'');
  t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',withUndo?6000:2600)}
function openSheet(html){document.getElementById('sheet').innerHTML='<div class="grip"></div>'+html;document.body.classList.add('open');document.getElementById('sheet').scrollTop=0}
function closeSheet(){document.body.classList.remove('open')}

/* ========== 画面 ========== */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===view));
  document.body.className=(document.body.classList.contains('open')?'open ':'')+'v-'+view;
  document.getElementById('app').innerHTML=({home:vHome,menu:vMenu,add:vAdd,log:vLog,settings:vSettings}[view])();
}
function tile(it){const st=status(it);
  return `<button class="tile ${st.k}" data-act="open" data-id="${it.id}"><span class="bd ${st.k}">${st.t}</span><span class="e">${emo(it)}</span><span class="n">${esc(it.name)}</span><span class="q">${fq(it.qty)}${esc(it.unit)}</span></button>`}
function compartment(loc,all){const its=all.filter(i=>i.loc===loc),fold=!!S.fold[loc];
  const inside=fold?'':`<div class="inside">${its.length?`<div class="shelf">${its.map(tile).join('')}</div>`:`<div class="none">からっぽです</div>`}</div>`;
  const door=`<button class="door" data-act="fold" data-v="${loc}" aria-expanded="${!fold}"><span>${LOC[loc].e} ${LOC[loc].room}</span><span class="cnt">${its.length}品</span>${loc==='pantry'?'':'<span class="handle"></span>'}<span class="arrow">${fold?'▼':'▲'}</span></button>`;
  return loc==='pantry'?`<section class="rack">${door}${inside}</section>`:`<section class="comp ${loc}">${door}${inside}</section>`}
function vHome(){
  const all=sorted(),hot=all.filter(i=>status(i).k!=='ok');
  let memo;
  if(!all.length)memo=`<b class="t">まだ何も入っていません</b>下の「＋ 入れる」から、レシートを撮るか手入力で食材を入れましょう。`;
  else if(hot.length)memo=`<b class="t">早めに使うもの</b><ul>${hot.slice(0,4).map(i=>{const s=status(i);return `<li><span>${emo(i)}</span><span class="nm">${esc(i.name)}</span><span class="badge ${s.k}">${s.t}</span></li>`}).join('')}</ul>${hot.length>4?`<div class="hint">ほか ${hot.length-4} 品</div>`:''}<button class="go" data-nav="menu">この食材で献立を考える　→</button>`;
  else memo=`<b class="t">急いで使う食材はありません</b>今日は好きなものを作れます。`;
  return `<div class="memo">${memo}</div>
  <div class="fridge">${compartment('fridge',all)}${compartment('freezer',all)}</div>

let cookIdx=-1,left=null;

const keepLabel=n=>n>=60?'約'+Math.round(n/30)+'か月':n>=14?'約'+Math.round(n/7)+'週間':n+'日';
const keepText=k=>LOCS.filter(l=>l!=='pantry').concat('pantry').map(l=>{const n=Math.max(0,+keepOf({keep:k})[l]||0);return LOC[l].t+(n>0?' '+keepLabel(n):' 不向き')}).join('・');

function ckRow(it,q){const all=q>=it.qty;

/* ========== Gemini ========== */
async function gemini(parts,temp){const s=S.settings;
  if(!s.apiKey)throw new Error('設定で Gemini APIキーを登録してください');
  let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(s.model)+':generateContent',{method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':s.apiKey},
    body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{responseMimeType:'application/json',temperature:temp==null?0.4:temp}})})}
  catch(e){throw new Error('通信できませんでした。電波の状態を確認してください')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message||''}catch(e){}
    if(r.status===429)throw new Error('無料枠の上限に達しました。少し待つか、明日もう一度お試しください');
    if(r.status===404)throw new Error('モデル「'+s.model+'」が見つかりません。設定でモデル名を変更してください');
    if(r.status===400||r.status===401||r.status===403)throw new Error('APIキーが正しくないか、利用できません（'+m.slice(0,80)+'）');
    throw new Error('AIの応答エラー（'+r.status+'）')}
  const j=await r.json();const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  try{return JSON.parse(txt.replace(/^```(?:json)?\s*|\s*```$/g,''))}catch(e){throw new Error('AIの返答を読み取れませんでした。もう一度お試しください')}}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    res(c.toDataURL('image/jpeg',0.85).split(',')[1])};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('画像を開けませんでした'))};img.src=u})}
async function readReceipt(file){
  busy=true;render();
  try{const data=await shrink(file);
    const out=await gemini([{text:`これは日本のスーパー等のレシート画像です。食品・飲料だけを抽出し、次の形のJSONだけを返してください。
{"items":[{"name":"一般的な食材名(例: 鶏もも肉、キャベツ。ブランド名・産地・略号・容量表記は除く)","qty":数値,"unit":"${UNITS.filter(u=>u!=='%').join('|')} のどれか","category":"${Object.keys(CATS).filter(c=>c!=='作りおき').join('|')} のどれか","loc":"fridge|freezer|pantry","days":その保存場所での購入日からの一般的な日持ち日数(整数)}]}
ルール: 日用品・レジ袋・値引き行・小計・合計・ポイントは除外。同じ商品は数量をまとめる。重さが分かる肉や魚は unit を g にしてもよい。loc は家庭での普通の保存場所で、fridge=冷蔵、freezer=冷凍、pantry=常温(米、缶詰、乾物、菓子、未開封の調味料や飲料など)。読み取れない行は推測せず除外。`},
      {inline_data:{mime_type:'image/jpeg',data}}],0.1);
    const list=(out.items||out||[]);if(!Array.isArray(list)||!list.length)throw new Error('食品が見つかりませんでした。明るい場所で撮り直してみてください');
    review=list.map(r=>{const name=String(r.name||'').trim(),f=lookup(name),loc=LOC[r.loc]?r.loc:'fridge';
      const cat=CATS[r.category]?r.category:(f?f.cat:'その他');
      const days=f?f[loc]:(parseInt(r.days)>0?parseInt(r.days):shelfDays(name,loc,cat));
      return{on:true,name,qty:parseFloat(r.qty)>0?parseFloat(r.qty):1,unit:UNITS.includes(r.unit)?r.unit:(f?f.unit:'個'),cat,loc,exp:addDays(today(),days)}}).filter(r=>r.name);
    if(!review.length){review=null;throw new Error('食品が見つかりませんでした')}
  }catch(e){toast(e.message)}
  busy=false;render();window.scrollTo(0,0)}
async function genMenu(silent){
  const items=sorted().filter(i=>daysLeft(i.exp)>=-1);if(!items.length||busy)return;
  busy=true;menuErr='';if(!silent||view==='menu')render();
  const prev=S.menu&&S.menu.dishes?S.menu.dishes.map(d=>d.name):[];
  try{const inv=items.map(i=>({id:i.id,name:i.name,qty:i.qty,unit:i.unit,place:LOC[i.loc].t,days_left:daysLeft(i.exp),...(i.cat==='作りおき'?{kind:'作りおき料理(残り'+i.qty+'%)'}:{})}));
    const out=await gemini([{text:`あなたは家庭料理の献立アドバイザーです。下の在庫から今日の献立(主菜・主食・副菜・汁物を各1品、計4品)を${S.settings.people}人分で考えてください。
- 主食はご飯・パン・麺類など。在庫になければ常備の米で白ごはんや混ぜご飯にしてよい。丼・パスタ・うどんのように主菜と主食を兼ねる料理は role を主菜にし、主食は省いてよい。
- uses には、その料理で使う在庫の食材をすべて漏れなく入れる。id は在庫の id をそのまま写す。
- kind が「作りおき料理」のものは調理済みの残り。温め直してそのまま一品にするか、アレンジして使う（uses の qty は使う割合の数値、unit は %）。
- keep は、その料理が残った場合に食べ切るべき日数の目安（保存方法ごと）。料理の内容から判断し、食品安全を優先して控えめにする。その保存方法に向かない場合は 0。
- days_left が小さい食材(特に ${S.settings.remindDays} 以下)を最優先で使い切る。期限まで余裕のある冷凍品・常温品は急がない。
- 塩・砂糖・醤油・味噌・酒・みりん・酢・油・だし・こしょう・片栗粉・小麦粉・米は常備していると仮定してよい。それ以外で在庫にないものはできるだけ使わない。
- 家庭で無理なく作れる手順(各6ステップ以内)。肉・魚は中心まで十分に加熱する。
${S.wish?'- 希望: '+S.wish+'\n':''}${prev.length?'- 前回の提案('+prev.join('、')+')とは別の料理にする。\n':''}
次の形のJSONだけを返す:
{"comment":"献立のひとこと(20字以内)","dishes":[{"role":"主菜|主食|副菜|汁物","name":"料理名","desc":"一文の説明","minutes":調理分数,"uses":[{"id":"在庫のid","name":"食材名","qty":使う量(在庫と同じ単位の数値),"unit":"単位"}],"others":["在庫以外に使う材料と分量"],"steps":["手順"],"keep":{"fridge":冷蔵での日数,"freezer":冷凍での日数,"pantry":常温での日数},"search":"クックパッド検索用に主な食材を2つ、空白区切り"}]}
在庫: ${JSON.stringify(inv)}`}],0.8);
    if(!out.dishes||!out.dishes.length)throw new Error('献立を作れませんでした。もう一度お試しください');
    S.menu={date:today(),comment:out.comment||'',dishes:out.dishes};save();
    if(silent&&view!=='menu')toast('今日の献立ができました');
  }catch(e){if(!silent)menuErr=e.message;S.menuTried=today();save()}
  busy=false;render()}

/* ========== カレンダー(.ics) / ファイル ========== */
function buildIcs(){const s=S.settings,byDay={};const now=new Date();
  for(const it of S.items){const d=daysLeft(it.exp);if(d<0)continue;let day=addDays(it.exp,-s.remindDays);if(day<today())day=today();(byDay[day]=byDay[day]||[]).push(it)}
  const fold=t=>t.replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const stamp=now.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//reizokoban//JA','CALSCALE:GREGORIAN'],n=0;
  for(const day of Object.keys(byDay).sort()){let h=s.remindHour;if(day===today()&&now.getHours()>=h)h=Math.min(23,now.getHours()+1);
    const its=byDay[day],dt=day.replace(/-/g,'')+'T'+pad(h)+'0000',dte=day.replace(/-/g,'')+'T'+pad(h)+'1500';
    out.push('BEGIN:VEVENT','UID:'+day+'@reizokoban','DTSTAMP:'+stamp,'DTSTART:'+dt,'DTEND:'+dte,
      'SUMMARY:'+fold('使い切ろう: '+its.map(i=>i.name).join('、')),
      'DESCRIPTION:'+fold(its.map(i=>i.name+' '+fq(i.qty)+i.unit+'（'+LOC[i.loc].t+'・期限 '+md(i.exp)+'）').join('\n')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+fold('期限が近い食材があります'),'TRIGGER:PT0M','END:VALARM','END:VEVENT');n++}
  out.push('END:VCALENDAR');return{text:out.join('\r\n'),count:n}}
async function giveFile(name,text,type){const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

  case'fSave':{syncForm();if(!form.name){toast('食材名を入れてください');break}if(!(form.qty>0)){toast('数量を入れてください');break}
    const rec={id:form.id||uid(),name:form.name,cat:form.cat,loc:form.loc,qty:form.qty,unit:form.unit,bought:form.bought,exp:form.exp,est:!form.touched||!!form.note};if(form.keep)rec.keep=form.keep;
    if(form.id){const i=S.items.findIndex(x=>x.id===form.id);if(i>=0)S.items[i]=rec;closeSheet()}else S.items.push(rec);
    S.fold[rec.loc]=false;save();const wasNew=!form.id;form=null;render();toast(rec.name+(wasNew?' を'+LOC[rec.loc].room+'に入れました':' を保存しました'));break}
  case'receipt':if(!S.settings.apiKey){toast('先に設定で Gemini APIキーを登録してください');break}document.getElementById('receiptFile').click();break;
  case'rvSave':{const add=review.filter(r=>r.on&&r.name&&r.qty>0);for(const r of add){S.items.push({id:uid(),name:r.name,cat:r.cat,loc:r.loc,qty:r.qty,unit:r.unit,bought:today(),exp:r.exp,est:true});S.fold[r.loc]=false}

  case'ckMore':document.getElementById('ckPick').hidden=false;b.hidden=true;break;
  case'ckAdd':{if(!it)break;const st=stepOf(it.unit);document.getElementById('ckRows').insertAdjacentHTML('beforeend',ckRow(it,Math.min(it.qty,it.unit==='g'||it.unit==='ml'?st*2:1)));
    b.remove();const nn=document.getElementById('ckNone');if(nn)nn.remove();break}
  case'ckSave':{if(left&&!(shelfDays('',left.loc,'作りおき',keepOf(S.menu.dishes[cookIdx]))>0)){toast('この料理は'+LOC[left.loc].t+'保存に向きません。保存場所を選び直してください');break}
    snap();let n=0;const used=[];document.querySelectorAll('#sheet .rv').forEach(r=>{if(!r.querySelector('[data-ck=on]').checked)return;

    if(d&&left){const k=keepOf(d);S.items.push({id:uid(),name:d.name,cat:'作りおき',loc:left.loc,qty:left.pct,unit:'%',bought:today(),exp:addDays(today(),shelfDays(d.name,left.loc,'作りおき',k)),est:true,keep:k});S.fold[left.loc]=false}
    const msg=left?'記録して、残りを'+LOC[left.loc].room+'に入れました':'記録しました（在庫から '+n+' 品）';left=null;
    save();closeSheet();render();toast(msg,true);break}
  case'ics':{const r=buildIcs();if(!r.count){toast('登録できる食材がありません');break}await giveFile('shokuzai-reminder.ics',r.text,'text/calendar');break}

function keepWish(){const w=document.getElementById('wish');if(w)S.wish=w.value.trim()}
